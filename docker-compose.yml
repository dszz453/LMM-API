# ============================================================
# LMM-API 一键部署配置
#
#   docker compose up -d
#
# 直接使用 GitHub 上已编译好的 AMD64 镜像，无需本地构建。
# ============================================================
services:
  lmm-api:
    # 从 GHCR 拉取已编译镜像
    image: ghcr.io/dszz453/lmm-api:2.5.1cl

    # 如需自行构建，把上面 image 注释掉，启用下面两行：
    # build:
    #   context: .
    #   dockerfile: Dockerfile.offline

    container_name: lmm-api
    restart: unless-stopped

    ports:
      # 宿主机端口:容器端口。冲突时改冒号左边
      - "3000:3000"

    environment:
      TZ: Asia/Shanghai

      # 会话密钥：生产环境建议改成随机字符串。
      # 不设置时程序会自动生成并持久化到 /data，重启不会掉登录态。
      # SESSION_SECRET: 请改成 64 位随机十六进制字符串

      # 使用外部数据库时填写；默认用内置 SQLite
      # SQL_DSN: "root:password@tcp(mysql:3306)/lmm-api"

      # Redis 缓存（可选，多副本部署时建议启用）
      # REDIS_CONN_STRING: "redis://redis:6379"

      # 流式响应超时（秒），出现空补全时可调大
      # STREAMING_TIMEOUT: 120

    volumes:
      # 持久化数据库与日志。升级/重建容器时务必保留
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# 若需 Redis，取消下面注释
#   redis:
#     image: redis:7-alpine
#     container_name: lmm-api-redis
#     restart: unless-stopped
#     volumes:
#       - ./redis-data:/data
